<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐猎人 Tide Hunter - MVP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 960px;
    height: 640px;
    image-rendering: pixelated;
  }
  canvas {
    display: block;
    width: 960px;
    height: 640px;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  #ui-layer {
    position: absolute;
    top: 0; left: 0;
    width: 960px; height: 640px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
